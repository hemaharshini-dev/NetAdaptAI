! Synthetic green-path fixture for the current rule engine only.
! Not a production configuration or a claim of benchmark certification.
hostname sih-green-path-01
version 17.9.4 IOS-XE
Chassis serial number DEMO-CISCO-001
aaa new-model
aaa authentication login default local
aaa authentication enable default enable
aaa accounting commands 15 default start-stop group tacacs+
aaa accounting connection default start-stop group tacacs+
aaa accounting exec default start-stop group tacacs+
aaa accounting network default start-stop group radius
aaa accounting system default start-stop group tacacs+
aaa authentication login VTY local
aaa authentication login HTTP local
aaa authentication login VTY local
aaa authentication login HTTP local
ip http authentication local
ip http secure-server
ip http max-connections 2
ip http timeout-policy idle 600 life 86400 requests 10000
ip admission auth-proxy-banner http banner-text
enable secret 9 demo-placeholder
service password-encryption
username demo secret 9 demo-placeholder
snmp-server host 192.0.2.50 version 3 priv
snmp-server enable traps snmp authentication linkup linkdown coldstart
snmp-server group demo v3 priv
no snmp-server
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
no cdp run
no service dhcp
service tcp-keepalives-in
service tcp-keepalives-out
no service pad
archive
 log config
  logging enable
logging buffered 64000
logging console critical
logging host 192.0.2.60
logging trap informational
service timestamps debug datetime msec show-timezone
logging source-interface Loopback0
login on-failure log
login on-success log
ntp authenticate
ntp authentication-key 1 md5 demo-placeholder
ntp trusted-key 1
ntp server 192.0.2.123 key 1
interface Loopback0
 ip address 192.0.2.1 255.255.255.255
ntp source Loopback0
no ip source-route
banner exec ^
 Authorised access only. All activity logged. ^
banner login ^
 Unauthorised access is prohibited. ^
banner motd ^
 NOTICE: Authorised users only. ^
line vty 0 15
 login authentication default
 transport input ssh
 access-class VTY-ACL in
 exec-timeout 10 0
line aux 0
 no exec
 exec-timeout 10 0
line con 0
 exec-timeout 10 0
