hostname branch-switch-01
version 17.9.4 IOS-XE
Chassis serial number FCW2501A1B2
ip ssh version 2
no service telnet
no ip http server
ip http secure-server
logging buffered 16384 informational
logging host 10.10.10.50
line vty 0 15
 exec-timeout 10 0
 transport input ssh
interface GigabitEthernet1/0/1
 description secure uplink
