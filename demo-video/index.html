<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NetAdaptAI Demo Video</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, "Segoe UI", Arial, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 28px; color: #edf6f0; background: #101916; }
    main { width: min(1100px, 100%); }
    .bar { display:flex; align-items:center; justify-content:space-between; gap:18px; margin:0 0 14px; }
    h1 { margin:0; font-size:18px; letter-spacing:-.3px; }
    p { color:#9eafa6; margin:5px 0 0; font-size:13px; }
    button { border:0; border-radius:8px; padding:12px 18px; color:#10251b; background:#81e3b0; font-weight:750; font-size:14px; cursor:pointer; }
    button:disabled { opacity:.55; cursor:wait; }
    canvas { display:block; width:100%; height:auto; border:1px solid #34433b; border-radius:10px; background:#f5f8f5; box-shadow:0 22px 80px #0008; }
    #status { min-height:20px; color:#b6c6bc; font-size:12px; }
  </style>
</head>
<body>
  <main>
    <div class="bar"><div><h1>NetAdaptAI · Demo video</h1><p>Captioned 16:9 walkthrough · about 45 seconds · sample data</p></div><button id="render">Render video</button></div>
    <canvas id="video" width="1280" height="720" aria-label="Video preview"></canvas>
    <p id="status">Press “Render video” to create and save the WebM file in this project folder.</p>
  </main>
<script>
const canvas = document.querySelector("#video"), ctx = canvas.getContext("2d");
const statusEl = document.querySelector("#status"), button = document.querySelector("#render");
const scenes = [6, 7, 9, 9, 7, 7], total = scenes.reduce((a,b)=>a+b,0);
const starts = scenes.map((_,i)=>scenes.slice(0,i).reduce((a,b)=>a+b,0));
let running = false, startedAt = 0;
const C = { ink:"#172722", muted:"#71817a", line:"#e0e8e2", green:"#49b77c", pale:"#eaf7ef", red:"#da665e", amber:"#d89d3e", paper:"#f4f8f5", dark:"#172923", white:"#fff", blue:"#4f7eb9" };
const captions = [
  ["Network configuration review, made practical.", "NetAdaptAI turns device configuration text into evidence-backed security findings."],
  ["Start with a Cisco IOS XE configuration.", "Upload a config or paste CLI text. The prototype normalizes supported settings locally."],
  ["Review PASS, FAIL, and UNKNOWN controls.", "Rules run deterministically. Unsupported evidence stays UNKNOWN instead of being guessed."],
  ["Teach the parser with human-reviewed mappings.", "A reviewer checks the suggested meaning, chooses a canonical fact, and approves it."],
  ["Reuse approved knowledge on future uploads.", "Confirmed patterns are stored in SQLite and applied to matching syntax."],
  ["Finish with a shareable PDF report.", "The report includes the assessment summary, evidence, expected values, and remediation."],
];
function roundRect(x,y,w,h,r,fill,stroke=null){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke();}}
function text(s,x,y,size=16,color=C.ink,weight=500,font="Segoe UI, Arial, sans-serif"){ctx.font=`${weight} ${size}px ${font}`;ctx.fillStyle=color;ctx.fillText(s,x,y);}
function wrap(s,x,y,max,size=14,color=C.muted,weight=500,line=22){ctx.font=`${weight} ${size}px Segoe UI, Arial, sans-serif`;ctx.fillStyle=color;const words=s.split(" ");let row="", yy=y;for(const word of words){const test=row?row+" "+word:word;if(ctx.measureText(test).width>max&&row){ctx.fillText(row,x,yy);row=word;yy+=line;}else row=test;}if(row)ctx.fillText(row,x,yy);}
function chip(label,x,y,color=C.green,bg=C.pale){roundRect(x,y,Math.max(66,label.length*7+22),25,12,bg);text(label,x+11,y+17,10,color,700,"Segoe UI, Arial, sans-serif");}
function card(x,y,w,h){roundRect(x,y,w,h,10,C.white,C.line);}
function sidebar(active){ctx.fillStyle=C.dark;ctx.fillRect(0,0,218,720);roundRect(24,23,34,34,9,"#76dda5");text("N",34,47,19,C.dark,800);text("NetAdapt",68,39,17,"#f2f8f4",800);text("AI",146,39,17,"#76dda5",800);text("CONFIGURATION SECURITY",68,53,8,"#9db4a8",600);text("MENU",28,104,10,"#829b8e",700,"Consolas, monospace");const nav=[["◈","Compliance overview"],["✦","Training queue"],["▤","Knowledge base"]];nav.forEach(([icon,label],i)=>{const y=122+i*48;if(i===active)roundRect(17,y,185,39,7,"#29473a");text(icon,31,y+25,16,i===active?"#a2e9bd":"#aabbb2",600);text(label,57,y+24,12,i===active?"#f1f8f4":"#aabbb2",600);if(i===1&&active===1){roundRect(172,y+10,20,19,9,"#83dfac");text("2",179,y+24,10,C.dark,800);}});text("●  ENGINE ONLINE",29,679,10,"#8ed8ac",700,"Consolas, monospace");}
function topbar(kicker,title){text(kicker.toUpperCase(),250,42,10,C.muted,700,"Consolas, monospace");text(title,250,76,27,C.ink,800);roundRect(1040,28,205,39,7,C.dark);text("＋  Ingest config",1073,53,12,C.white,700);}
function metric(x,label,val,detail,color=C.ink){card(x,120,184,112);text(label.toUpperCase(),x+17,146,9,C.muted,700,"Consolas, monospace");text(val,x+16,191,35,color,800);text(detail,x+17,215,10,C.muted,500);}
function finding(x,y,state,id,title,summary){card(x,y,640,68);const col=state==="PASS"?C.green:state==="FAIL"?C.red:C.amber;roundRect(x+14,y+18,31,31,16,state==="PASS"?"#e8f7ed":state==="FAIL"?"#fff0ee":"#fff6e3");text(state==="PASS"?"✓":state==="FAIL"?"!":"?",x+24,y+39,15,col,800);text(title,x+58,y+26,12,C.ink,700);text(`${id}  ·  ${summary}`,x+58,y+47,10,C.muted,500);chip(state,x+548,y+21,col,state==="PASS"?"#e8f7ed":state==="FAIL"?"#fff0ee":"#fff6e3");}
function baseFrame(active,kicker,title){ctx.fillStyle=C.paper;ctx.fillRect(0,0,1280,720);sidebar(active);topbar(kicker,title);}
function drawScene(i,t){const fade=Math.min(1,t/.55,(scenes[i]-t)/.45);ctx.save();ctx.globalAlpha=Math.max(.15,fade);baseFrame(i===3?1:i===4?2:0,["PROJECT DEMO","CONFIGURATION INGESTION","CIS ASSESSMENT","HUMAN REVIEW","LEARNED KNOWLEDGE","PDF REPORT"][i],["NetAdaptAI","Analyze a device configuration","Evidence-backed control results","Review before the system learns","Knowledge that carries forward","A complete report, ready to share"][i]);
 if(i===0){roundRect(250,120,960,476,18,"#eaf5ed");roundRect(285,156,68,68,18,C.dark);text("N",305,202,38,"#83e1ad",800);text("NetAdaptAI",285,284,52,C.ink,800);text("Configuration security assessments with a human-reviewed learning loop",288,323,18,C.muted,500);chip("CISCO IOS XE 17.x  ·  CIS BENCHMARK",288,364,C.green,"#fff");roundRect(288,427,230,53,9,C.dark);text("SEE THE WORKFLOW",313,460,12,C.white,700);text("LOCAL PROTOTYPE  ·  SAMPLE DEVICE DATA",288,555,10,C.muted,700,"Consolas, monospace");}
 if(i===1){chip("DEMO CONFIG",252,98,C.blue,"#edf3fb");card(250,134,580,419);text("branch-switch-01.cfg",278,171,14,C.ink,700);text("CISCO IOS XE · CONFIGURATION TEXT",278,194,9,C.muted,600,"Consolas, monospace");roundRect(272,211,535,310,8,"#172923");const lines=["hostname branch-switch-01","version 17.9.4 IOS-XE","ip ssh version 2","service telnet","ip http server","logging buffered 16384 informational","line vty 0 15"," exec-timeout 30 0"," transport input telnet"];lines.forEach((s,j)=>text(s,294,245+j*28,13,j===2?"#8fe1af":j===3||j===4?"#ff9a8d":"#d8e7de",500,"Consolas, monospace"));card(855,134,355,419);text("INGEST & NORMALIZE",881,176,10,C.muted,700,"Consolas, monospace");[["Vendor","Cisco"],["Platform","IOS XE"],["SSH protocol","Version 2"],["Telnet service","Enabled"],["HTTP management","Enabled"]].forEach((r,j)=>{const yy=219+j*57;text(r[0],881,yy,12,C.muted);text(r[1],1068,yy,12,j>2?C.red:C.ink,700);if(j<4){ctx.strokeStyle=C.line;ctx.beginPath();ctx.moveTo(881,yy+17);ctx.lineTo(1185,yy+17);ctx.stroke();}});roundRect(881,493,300,34,6,"#eaf7ef");text("Ready for deterministic assessment",897,515,11,"#347c54",700);}
 if(i===2){metric(250,"Posture score","42%","PASS ÷ all controls",C.amber);metric(447,"CIS controls","56","Level 1 benchmark");metric(644,"Fail","18","controls needing review",C.red);metric(841,"Unknown","14","unsupported evidence",C.amber);metric(1038,"Mappings","2","awaiting review",C.blue);text("PRIORITY FINDINGS",250,270,10,C.muted,700,"Consolas, monospace");finding(250,288,"PASS","2.1.1.2","Use SSH protocol version 2","Expected 2 · Actual 2 · ip ssh version 2");finding(250,366,"FAIL","1.2.2","Restrict VTY transport to SSH","Expected enabled · Telnet transport found");finding(250,444,"UNKNOWN","2.2.8","Log successful and failed logins","Missing evidence is not treated as a pass");card(914,288,296,224);text("SCORING",938,324,10,C.muted,700,"Consolas, monospace");text("PASS / all controls",938,359,20,C.ink,750);wrap("Controls with unsupported or missing evidence remain UNKNOWN and stay in the denominator.",938,389,245,12,C.muted,500,20);chip("DETERMINISTIC RULES",938,465,C.green,"#eaf7ef");}
 if(i===3){card(250,120,960,447);text("TRAINING QUEUE",278,159,10,C.muted,700,"Consolas, monospace");text("Teach the parser a new command",278,190,21,C.ink,800);card(278,215,904,73);text("ssh strength two",300,244,14,C.ink,700,"Consolas, monospace");text("Cisco · IOS XE · AI suggestion",300,268,10,C.muted);chip("91% CONFIDENCE",885,236,C.blue,"#edf3fb");roundRect(1012,231,145,36,7,"#eaf7ef");text("Review mapping",1030,254,11,"#32764f",700);roundRect(278,310,904,220,10,"#f8fbf8",C.line);text("HUMAN APPROVAL",304,346,10,C.green,700,"Consolas, monospace");text("Canonical control",304,385,11,C.muted);text("management.ssh.version",490,385,13,C.ink,700,"Consolas, monospace");text("Canonical value",304,422,11,C.muted);text("Version 2",490,422,13,C.ink,700);roundRect(886,463,268,42,8,C.dark);text("✓  Approve & add to knowledge base",904,489,11,C.white,700);text("An approved mapping becomes a reusable fact; the rule engine still decides PASS or FAIL.",278,551,11,C.muted);}
 if(i===4){card(250,120,960,447);text("KNOWLEDGE BASE",278,159,10,C.muted,700,"Consolas, monospace");text("Confirmed mappings",278,190,21,C.ink,800);const rows=[["ssh strength two","SSHv2","management.ssh.version = 2","Cisco · IOS XE"],["set system services ssh protocol-version v2","SSH protocol v2","management.ssh.version = 2","Juniper · Junos"]];rows.forEach((r,j)=>{const yy=224+j*86;card(278,yy,904,68);text(r[0],300,yy+27,12,C.ink,700,"Consolas, monospace");text(r[1],300,yy+49,10,C.muted);chip(r[2],685,yy+20,C.blue,"#edf3fb");text(r[3],1003,yy+40,10,C.muted,600);});roundRect(278,425,904,92,9,"#eaf7ef");text("NEXT UPLOAD",302,459,10,C.green,700,"Consolas, monospace");text("Matching syntax populates the canonical fact without another suggestion request.",302,487,13,C.ink,600);}
 if(i===5){card(250,120,960,447);roundRect(278,145,570,395,8,"#fff",C.line);roundRect(278,145,570,67,8,C.dark);text("NetAdaptAI compliance report",302,178,17,C.white,750);text("CIS Cisco IOS XE 17.x Benchmark v2.2.1",302,197,10,"#b8cbc0");text("Device: branch-switch-01",302,244,12,C.ink,700);text("Assessment summary",302,282,11,C.muted);chip("PASS 24",302,301,C.green,"#eaf7ef");chip("FAIL 18",394,301,C.red,"#fff0ee");chip("UNKNOWN 14",482,301,C.amber,"#fff6e3");ctx.strokeStyle=C.line;ctx.beginPath();ctx.moveTo(302,347);ctx.lineTo(824,347);ctx.stroke();text("Control 1.2.2 · VTY transport",302,379,11,C.ink,700);text("Expected: SSH only · Actual: Telnet enabled",302,401,10,C.muted);text("Evidence: line vty transport input telnet",302,423,10,C.muted);text("Remediation: transport input ssh",302,445,10,C.muted);text("...",302,487,12,C.muted);roundRect(891,210,256,64,10,C.dark);text("↓  PDF REPORT",923,250,15,C.white,750);text("Every control includes",891,326,14,C.ink,700);["Expected and actual values","Configuration evidence","Recommended remediation","Benchmark and device details"].forEach((s,j)=>{text("✓",891,363+j*31,13,C.green,800);text(s,915,363+j*31,12,C.muted,500);});}
 const [line1,line2]=captions[i];roundRect(250,613,960,76,10,"#172923");text(line1,276,644,17,C.white,750);text(line2,276,670,12,"#c1d2c8",500);ctx.fillStyle="#dfe9e3";ctx.fillRect(250,704,960,3);ctx.fillStyle="#53c989";ctx.fillRect(250,704,960*Math.min(1,(starts[i]+t)/total),3);ctx.restore();}
function frame(){if(!running)return;const elapsed=(performance.now()-startedAt)/1000;if(elapsed>=total){running=false;return;}const scene=starts.findLastIndex(x=>x<=elapsed);drawScene(scene,elapsed-starts[scene]);requestAnimationFrame(frame);}
window.addEventListener("error",e=>{statusEl.textContent=`Renderer error: ${e.message}`;});
window.addEventListener("unhandledrejection",e=>{statusEl.textContent=`Renderer error: ${e.reason?.message||e.reason}`;});
drawScene(0,0);
button.addEventListener("click",async()=>{if(running)return;if(!canvas.captureStream||!window.MediaRecorder){statusEl.textContent="This browser cannot export WebM. Try current Chrome or Edge.";return;}button.disabled=true;statusEl.textContent="Rendering the demo… keep this tab open.";const chunks=[],stream=canvas.captureStream(30);let recorder;try{recorder=new MediaRecorder(stream,{mimeType:"video/webm;codecs=vp8",videoBitsPerSecond:2200000});}catch{recorder=new MediaRecorder(stream);}recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};recorder.onstop=async()=>{stream.getTracks().forEach(x=>x.stop());try{const blob=new Blob(chunks,{type:recorder.mimeType||"video/webm"});const response=await fetch("/save",{method:"POST",headers:{"Content-Type":"video/webm"},body:blob});if(!response.ok)throw new Error(await response.text());const result=await response.json();statusEl.textContent=`Video saved: ${result.path} · ${(blob.size/1024/1024).toFixed(1)} MB`;button.textContent="Render again";}catch(e){statusEl.textContent=`Could not save video: ${e.message}`;button.textContent="Try again";}button.disabled=false;};recorder.start(1000);running=true;startedAt=performance.now();frame();setTimeout(()=>{if(recorder.state!=="inactive")recorder.stop();},total*1000+150);});
</script>
</body>
</html>
